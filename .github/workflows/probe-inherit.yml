name: probe-inherit
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          mkdir -p ctx && echo hi > ctx/f
          printf 'FROM scratch\nCOPY f /f\n' > ctx/Dockerfile
          docker build -t ghcr.io/zyphoriate/probe-inherit:latest ctx
          docker push ghcr.io/zyphoriate/probe-inherit:latest
      - run: |
          docker buildx imagetools inspect ghcr.io/zyphoriate/probe-inherit:latest || true
