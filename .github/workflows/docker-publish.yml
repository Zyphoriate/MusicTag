name: build-and-push

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/zyphoriate/musictag
  PKG: musictag

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./docker-v2
          file: ./docker-v2/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v2.8.2
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Music Tag Web image

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_HOST: github.com
        run: |
          set -euo pipefail
          api_hdr=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          try_patch() {
            local endpoint="$1"
            local out status
            out=$(gh api --method PATCH "$endpoint" "${api_hdr[@]}" -f visibility=public 2>&1) && {
              echo "OK: $endpoint"
              echo "$out" | head -40
              return 0
            } || status=$?
            echo "FAIL($status): $endpoint"
            echo "$out" | head -10
            return 1
          }

          ok=0
          try_patch "/repos/${GITHUB_REPOSITORY}/packages/container/${PKG}" && ok=1
          [ "$ok" -eq 1 ] || try_patch "/user/packages/container/${PKG}" || true

          echo "::group::verify anonymous pull"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:zyphoriate/${PKG}:pull")
          echo "anonymous token endpoint: HTTP $code"
          echo "::endgroup::"
          if [ "$code" != "200" ]; then
            echo "::warning::package still private (anonymous token HTTP $code). A token with write:packages is required, or flip visibility in package settings."
          fi
