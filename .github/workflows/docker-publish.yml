name: build-and-push

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/zyphoriate/musictag
  PKG: musictag

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./docker-v2
          file: ./docker-v2/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v2.8.2
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Music Tag Web image

      - name: Verify anonymous pull
        run: |
          set -euo pipefail
          # A package created by a workflow in a public repository is public.
          # A package created while the repo was private stays private forever:
          # GitHub exposes no API to change container package visibility.
          tok=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:zyphoriate/${PKG}:pull" \
                | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 -H "Authorization: Bearer ${tok}" \
                 -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
                 "https://ghcr.io/v2/zyphoriate/${PKG}/manifests/latest")
          echo "anonymous manifest: HTTP ${code}"
          [ "${code}" = "200" ] || { echo "::error::package is not anonymously pullable (HTTP ${code})"; exit 1; }

      - name: Summary
        run: |
          echo "### ${{ env.IMAGE }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'docker pull ${{ env.IMAGE }}:latest' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
